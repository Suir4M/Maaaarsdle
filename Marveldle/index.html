<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0709">
  <title>Marveldle</title>
  <meta name="description" content="Devine le personnage de l'univers Marvel grâce aux indices : espèce, famille, saison…">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%9B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Marveldle</h1>

    <div id="home">
      <p class="tag">Devine les personnages de l'univers Marvel</p>
      <div class="cards">
        <button data-t="a"><i>✦</i><b>Classique</b><small>Trouve le perso grâce aux indices</small></button>
        <button data-t="b"><i>💬</i><b>Citation</b><small>Qui a dit cette réplique ?</small></button>
        <button data-t="c"><i>🪞</i><b>Flou</b><small>Découvre le personnage flouté</small></button>
      </div>
    </div>

    <button id="back" hidden>← Menu</button>
    <section id="a"></section><section id="b"></section><section id="c"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="../game/utils.js"></script>
  <script src="../game/picker.js"></script>
  <script src="../game/classic-game.js"></script>
  <script src="../game/blur-game.js"></script>
  <script src="../game/citation-game.js"></script>
  
  <script src="js/main.js"></script>
  <script src="../game/home-button.js" data-href="../"></script>
  <script src="../game/i18n.js"></script>
</body>
</html>
